<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/images/unisphere_sphere_logo_1795776222557.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniSphere 360+</title>
    <meta name="description" content="AI-powered smart university and career workspace platform for Students, Graduates, Doctors, and Administrators." />
    <meta property="og:title" content="UniSphere 360+" />
    <meta property="og:description" content="AI-powered smart university and career workspace platform for Students, Graduates, Doctors, and Administrators." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("unisphere.theme");
          var theme = stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) { /* private mode: stay light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
